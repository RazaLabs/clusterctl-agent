# Branches:
#   develop     day-to-day work   → image :develop
#   master      next release      → image :master
#   production  what users run    → image :latest (the install YAML is read from here)
#   tag vX.Y.Z  a release         → image :X.Y.Z and :X.Y (the install YAML pins this)
# Pull requests run the same checks and build the image without pushing it.
name: ci

on:
  pull_request:
  push:
    branches: [master, develop, production]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Install YAML must apply cleanly (it's generated in the kubctl app's repo).
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
      # A throwaway cluster, so apply for real: a server dry run can't create
      # the namespace the other objects need.
      - run: kubectl apply -f deploy/kubctl-agent.yaml

  image:
    needs: [test, vulnerabilities, manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/razalabs/kubctl-agent
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/production' }}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/production' }}
            type=sha,enable=${{ github.event_name == 'push' }}
            type=ref,event=pr
      - uses: docker/build-push-action@v6
        with:
          context: .
          # PRs only check that it builds; pushes publish both architectures.
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name == 'push' }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
