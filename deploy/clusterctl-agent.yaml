# clusterctl agent 0.1.0: sends alerts about this cluster to clusterctl on your phone.
#
# 1. Check CLUSTER_NAME below: it is the name shown in notifications.
# 2. kubectl apply -f clusterctl-agent.yaml
# 3. Pair your phone: in clusterctl, open Settings › Alerts on this cluster. If your
#    account can read the agent's secret it pairs by itself; otherwise share this code:
#    kubectl -n clusterctl-system get secret clusterctl-agent -o jsonpath='{.data.pairing-code}' | base64 -d
---
apiVersion: v1
kind: Namespace
metadata:
  name: clusterctl-system
  labels:
    app.kubernetes.io/name: clusterctl-agent
    app.kubernetes.io/managed-by: clusterctl
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clusterctl-agent
  namespace: clusterctl-system
  labels:
    app.kubernetes.io/name: clusterctl-agent
    app.kubernetes.io/managed-by: clusterctl
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: clusterctl-agent
  labels:
    app.kubernetes.io/name: clusterctl-agent
    app.kubernetes.io/managed-by: clusterctl
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - nodes
  - persistentvolumeclaims
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  - daemonsets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - gateways
  - httproutes
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clusterctl-agent
  labels:
    app.kubernetes.io/name: clusterctl-agent
    app.kubernetes.io/managed-by: clusterctl
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: clusterctl-agent
subjects:
- kind: ServiceAccount
  name: clusterctl-agent
  namespace: clusterctl-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: clusterctl-agent
  namespace: clusterctl-system
  labels:
    app.kubernetes.io/name: clusterctl-agent
    app.kubernetes.io/managed-by: clusterctl
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  - configmaps
  verbs:
  - get
  - create
  - update
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: clusterctl-agent
  namespace: clusterctl-system
  labels:
    app.kubernetes.io/name: clusterctl-agent
    app.kubernetes.io/managed-by: clusterctl
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: clusterctl-agent
subjects:
- kind: ServiceAccount
  name: clusterctl-agent
  namespace: clusterctl-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clusterctl-agent-config
  namespace: clusterctl-system
  labels:
    app.kubernetes.io/name: clusterctl-agent
    app.kubernetes.io/managed-by: clusterctl
data:
  details: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clusterctl-agent
  namespace: clusterctl-system
  labels:
    app.kubernetes.io/name: clusterctl-agent
    app.kubernetes.io/managed-by: clusterctl
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: clusterctl-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clusterctl-agent
        app.kubernetes.io/managed-by: clusterctl
    spec:
      serviceAccountName: clusterctl-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: agent
        image: ghcr.io/razalabs/clusterctl-agent:0.1.0
        imagePullPolicy: IfNotPresent
        env:
        - name: RELAY_URL
          value: https://api-clusterctl.razalabs.com
        - name: CLUSTER_NAME
          value: my-cluster
        - name: PORT
          value: "8080"
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 30
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            memory: 192Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: clusterctl-agent
  namespace: clusterctl-system
  labels:
    app.kubernetes.io/name: clusterctl-agent
    app.kubernetes.io/managed-by: clusterctl
spec:
  selector:
    app.kubernetes.io/name: clusterctl-agent
  ports:
  - name: http
    port: 8080
    targetPort: http
